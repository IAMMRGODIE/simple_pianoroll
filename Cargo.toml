[package]
name = "simple_pianoroll"
version = "0.1.0"
edition = "2024"

[dependencies]
# Reuse i_am_dsp's DSP core (Tuning / Adsr / generators / NoteEvent / ProcessContext).
# Default features are disabled: its "standalone" feature drags in demo-only
# eframe/egui/cpal and would break the wasm target. We depend on eframe / cpal /
# anyhow directly, so only the DSP core comes from i_am_dsp.
i_am_dsp = { path = "../i_am_dsp/i_am_dsp", default-features = false }
eframe = "0.36"
cpal = "0.18.2"
anyhow = "1.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
# rand (via i_am_dsp) pulls getrandom 0.4, which needs wasm_js on wasm32-unknown-unknown
getrandom = { version = "0.4", features = ["wasm_js"] }
# to find the canvas element for eframe's WebRunner
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlCanvasElement",
  "HtmlInputElement", "FileReader", "FileList", "File",
  "Blob", "Url", "HtmlAnchorElement", "Node", "HtmlElement",
] }
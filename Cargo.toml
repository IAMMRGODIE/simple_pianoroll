[package]
name = "simple_pianoroll"
version = "0.1.0"
edition = "2024"

[dependencies]
# Reuse i_am_dsp's DSP core (Tuning / Adsr / generators / NoteEvent / ProcessContext).
# Default features bring egui(0.36) + eframe(0.36) + cpal(0.18) via its real_time_demo,
# matching the versions used below so they unify into one set of crates.
i_am_dsp = { path = "../i_am_dsp/i_am_dsp" }
eframe = "0.36"
cpal = "0.18.2"
anyhow = "1.0"
rfd = "0.17.2"
